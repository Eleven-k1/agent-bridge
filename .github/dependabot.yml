version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web-ui/client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: vite
        versions: [">=7.0.0"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=5.0.0"]
